<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruan Pedro Imports — Links</title>
<meta name="description" content="Tênis e bonés importados. Todos os links da Ruan Pedro Imports em um só lugar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b0b0a; --ink-2:#151412;
    --paper:#faf7ef; --paper-2:#f1ead7; --paper-3:#ece3cc; --line:#e2d9c2;
    --gold-1:#fff3c4; --gold-2:#f2ca5c; --gold-3:#d4af37; --gold-4:#a2731f;
    --gold-grad:linear-gradient(135deg,var(--gold-1) 0%,var(--gold-2) 32%,var(--gold-3) 62%,var(--gold-4) 100%);
    --ink-text:#2a2618; --muted:#726b54; --muted-2:#948c72; --on-dark-muted:#cdc4a4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    background:var(--paper);color:var(--ink-text);-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;justify-content:center;padding:52px 20px 60px;
  }
  .wrap{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;}
  .logo-mark{
    width:108px;height:108px;border-radius:50%;overflow:hidden;background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 1px rgba(212,175,55,.35), 0 14px 34px rgba(212,175,55,.2);margin-bottom:20px;
  }
  .logo-mark img{width:82%;height:82%;object-fit:contain;}
  h1{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:600;font-size:1.6rem;text-align:center;color:var(--ink);}
  p.tag{font-size:.8rem;color:var(--muted);text-align:center;margin-top:6px;letter-spacing:.02em;}

  .links{width:100%;margin-top:32px;display:flex;flex-direction:column;gap:14px;}
  .link-btn{
    display:flex;align-items:center;gap:14px;width:100%;padding:16px 20px;border-radius:16px;
    background:var(--paper);border:1.5px solid var(--line);color:var(--ink-text);text-decoration:none;
    font-weight:700;font-size:.9rem;letter-spacing:.01em;transition:.18s;
  }
  .link-btn:hover, .link-btn:active{border-color:var(--gold-3);background:var(--paper-2);transform:translateY(-1px);}
  .link-btn.featured{background:var(--ink);color:var(--gold-2);border-color:var(--ink);box-shadow:0 10px 26px rgba(11,11,10,.18);}
  .link-btn.featured .link-icon,.link-btn.featured .arrow{color:var(--gold-2);}
  .link-btn.featured small{color:var(--on-dark-muted);}
  .link-btn.whatsapp{background:var(--gold-grad);color:var(--ink);border-color:transparent;box-shadow:0 10px 24px rgba(212,175,55,.28);}
  .link-btn.whatsapp:hover{filter:brightness(1.04);}
  .link-icon{width:26px;height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .link-icon svg{width:22px;height:22px;}
  .link-text{flex:1;}
  .link-text small{display:block;font-weight:500;font-size:.7rem;color:var(--muted);margin-top:2px;}
  .arrow{opacity:.55;font-size:1rem;color:var(--ink);}

  footer{margin-top:40px;text-align:center;color:var(--muted-2);font-size:.7rem;letter-spacing:.03em;}
</style>
</head>
